[package]
name = "certval-cng"
version = "0.1.0-rc.1"
description = """
Windows CNG crypto provider for certval. Performs message digest calculation and certificate
signature verification with Cryptography API: Next Generation, so certification path validation on
Windows can use the operating system's validated cryptographic module rather than an in-process
software implementation. With `cms`, certval-cms's content encryption, key transport, key agreement
and signing go through CNG too.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-cng"
categories = ["cryptography"]
keywords = ["x509", "certval", "windows", "cng"]
readme = "README.md"
edition = "2021"
rust-version = "1.89"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = []
# Enables certval's software ML-DSA verification, and with `cms`, certval-cms's software ML-DSA
# signing. The provider needs neither, since its ML-DSA is CNG's, but without them the ML-DSA tests
# have no software to compare against.
pqc = ["certval/pqc", "certval-cms?/pqc"]
# Implements certval-cms's content encryption and decryption and key transport by BCrypt, and
# recipient and signing credentials over NCrypt keys, including those in the certificate store.
cms = ["dep:certval-cms", "dep:cms", "dep:pkcs8", "dep:x509-cert", "dep:zeroize"]

[dependencies]
certval = { version = "0.2.0-rc.3", default-features = false }

const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"

log = "0.4.33"

# Under the `cms` feature.
certval-cms = { version = "0.1.0-rc.1", optional = true }
cms = { version = "=0.3.0-rc.2", optional = true }
pkcs8 = { version = "0.11.0", optional = true }
x509-cert = { version = "0.3.0", default-features = false, optional = true }
zeroize = { version = "1.8.1", optional = true }

[target.'cfg(windows)'.dependencies]
# LibraryLoader finds NCryptDecapsulate at run time: ncrypt.dll exports it only where CNG has ML-KEM.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# certval's software RSA, which the tests compare this provider's verdicts against. A dev-dependency,
# so the application, not this crate, decides which algorithms certval's software offers.
certval = { version = "0.2.0-rc.3", default-features = false, features = ["rsa"] }
x509-cert = { version = "0.3.0", features = ["builder", "hazmat"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
signature = "3.0.0"
# The cms tests: keys generated in software and imported into CNG, recipient identifiers, and the
# random number generator certval-cms's builders take.
rsa = { version = "0.10.0", features = ["encoding", "pkcs1v15"] }
elliptic-curve = { version = "0.14.3", features = ["arithmetic"] }
getrandom = { version = "0.4.1", features = ["sys_rng"] }
rand_core = "0.10.1"
# The ML-DSA and ML-KEM cms tests, under `pqc`: keys generated in software, as PKCS #8 for CNG to
# import.
ml-dsa = { version = "0.1.1", features = ["pkcs8"] }
ml-kem = { version = "0.3.4", features = ["pkcs8"] }

[package.metadata.docs.rs]
# The provider exists only on Windows.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
# certval-cms is not on crates.io yet, so the `cms` feature takes it from the neighboring checkout.
# Remove this once it publishes.
certval-cms = { path = "../certval-cms" }
# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# certval = { path = "../rust-pki/certval" }
